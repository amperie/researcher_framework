services:
  postgres:
    image: postgres:16
    ports: ["127.0.0.1:55439:5432"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
secrets:
  postgres_password:
    file: .tmp/postgres-test.password
