  neuralsignal_memory:
    tool: core.tools.research_tools.collect_memory
    path: core.tools.research_tools.collect_memory
    name: memory
    n_results: 5

  neuralsignal_profile_context:
    tool: core.tools.research_tools.collect_profile_context
