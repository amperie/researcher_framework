  trading_adapter_context:
    tool: core.tools.research_tools.collect_adapter_context
    path: core.tools.research_tools.collect_adapter_context
    name: adapter_context

  trading_profile_context:
    tool: core.tools.research_tools.collect_profile_context
    path: core.tools.research_tools.collect_profile_context
    name: profile_context
    include:
      - base_classes
      - datasets
      - data_sources
      - risk_constraints
      - evaluation

  trading_strategy_library:
    tool: core.tools.research_tools.collect_strategy_library
    path: core.tools.research_tools.collect_strategy_library
    name: strategy_library
    patterns:
      - "*strategy*.py"
      - "*signal*.py"
      - "*backtest*.py"
      - "*portfolio*.py"
      - "*risk*.py"
    max_files: 80

  neuralsignal_arxiv:
    tool: core.tools.research_tools.collect_arxiv
    path: core.tools.research_tools.collect_arxiv
    name: arxiv
    categories: [cs.LG, cs.AI, cs.CL]
