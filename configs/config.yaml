# Global runtime configuration for the research pipeline.
# Profile-specific settings (prompts, datasets, base classes, metrics, step list)
# belong in configs/profiles/<name>.yaml — not here.
#
# Secrets use ${ENV_VAR} or ${ENV_VAR:default} syntax.
# Values are resolved from environment variables or configs/.env (if present).

# ── LLM ───────────────────────────────────────────────────────────────────────
llm_provider: anthropic                        # anthropic | openai
llm_model: ~                                   # null = use profile default
anthropic_api_key: ${ANTHROPIC_API_KEY:}
openai_api_key: ${OPENAI_API_KEY:}

# ── MongoDB ───────────────────────────────────────────────────────────────────
mongo_url: ${MONGO_URL:mongodb://hp.lan:27017}
datasets_db_name: researcher_datasets
artifacts_db_name: ${ARTIFACTS_DB_NAME:researcher_artifacts}
artifacts_collection: ${ARTIFACTS_COLLECTION:artifacts}

# ── ChromaDB ──────────────────────────────────────────────────────────────────
chroma_host: ${CHROMA_HOST:hp.lan}
chroma_port: ${CHROMA_PORT:8000}
chroma_ssl: false
chroma_auth_token: ${CHROMA_AUTH_TOKEN:}
chroma_collection: experiments

# ── Memory graph backend ─────────────────────────────────────────────────────
memory_graph_backend: ${MEMORY_GRAPH_BACKEND:neo4j}   # noop | neo4j
memory_neo4j_uri: ${MEMORY_NEO4J_URI:neo4j://hp.lan:7687}
memory_neo4j_username: ${MEMORY_NEO4J_USERNAME:neo4j}
memory_neo4j_password: ${MEMORY_NEO4J_PASSWORD:password123}
memory_neo4j_database: ${MEMORY_NEO4J_DATABASE:neo4j}

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow_uri: ${MLFLOW_URI:http://hp.lan:8899}

# ── Artifact storage ──────────────────────────────────────────────────────────
artifact_store_backend: ${ARTIFACT_STORE_BACKEND:s3}
dev_root: ${DEV_ROOT:dev}
artifact_store_root: ${ARTIFACT_STORE_ROOT:dev/artifacts}

# Cache locations can be platform-specific. Relative dev/... paths are resolved
# against dev_root by configs.config.cache_path().
cache_locations:
  uv:
    windows: ${UV_CACHE_DIR_WINDOWS:dev/uv-cache}
    linux: ${UV_CACHE_DIR_LINUX:/tmp/neuralsignalresearcher/uv-cache}
    macos: ${UV_CACHE_DIR_MACOS:~/Library/Caches/neuralsignalresearcher/uv-cache}

s3_endpoint_url: ${S3_ENDPOINT_URL:http://hp.lan:9000}
s3_access_key_id: ${S3_ACCESS_KEY_ID:minioadmin}
s3_secret_access_key: ${S3_SECRET_ACCESS_KEY:minioadmin123}
s3_bucket: ${S3_BUCKET:researcher-artifacts}
s3_region_name: ${S3_REGION_NAME:us-east-1}
s3_prefix: ${S3_PREFIX:}
s3_secure: ${S3_SECURE:false}

# ── Experiment execution ──────────────────────────────────────────────────────
experiment_timeout_seconds: 18000
validate_timeout_seconds: 120
experiments_dir: ${EXPERIMENTS_DIR:dev/experiments}

# ── neuralsignal plugin ───────────────────────────────────────────────────────
neuralsignal_python: ${NEURALSIGNAL_PYTHON:uv run python}
neuralsignal_src_path: ${NEURALSIGNAL_SRC_PATH:../neuralsignal/neuralsignal}
trading_python: ${TRADING_PYTHON:uv run python}
ray_mode: ${RAY_MODE:local}              # local | remote
ray_address: ${RAY_ADDRESS:auto}         # remote cluster address when ray_mode=remote
ray_namespace: ${RAY_NAMESPACE:neuralsignalresearcher}

# ── Arxiv ─────────────────────────────────────────────────────────────────────
max_arxiv_papers: 10

# ── Dev workspace maintenance ─────────────────────────────────────────────────
maintenance:
  dev_cleanup:
    enabled: true
    interval_hours: 12
    state_keep_latest: 8
    state_max_age_days: 14
    papers_max_age_days: 30
    generated_tests_max_age_days: 14
    terminal_jobs_max_age_days: 7

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: DEBUG
  ignore_loggers:
    - name: pymongo
      max_level: INFO
    - name: mongo
      max_level: INFO
    - name: neo4j
      max_level: INFO
    - name: chromadb
      max_level: INFO
    - name: chroma
      max_level: INFO

  console:
    enabled: true
    level: INFO
    format: "%(asctime)s [%(levelname)-8s] %(name)s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%H:%M:%S"

  file:
    enabled: true
    level: DEBUG
    path: "logs/research.log"
    max_bytes: 10485760   # 10 MB
    backup_count: 5
    format: "%(asctime)s [%(levelname)-8s] %(name)-40s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
