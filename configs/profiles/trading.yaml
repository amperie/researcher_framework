name: trading
description: >
  Research and experiment automation for algorithmic trading strategies.
  Generates Algorithm subclasses for the local trading platform, validates them
  against the platform contract, and delegates backtesting or walk-forward
  execution to the trading adapter.

pipeline:
  steps:
    - research
    - ideate
    - refine
    - propose_experiments
    - plan_implementation
    - implement
    - validate
    - prepare_experiment
    - execute_experiment
    - evaluate
    - store_results
    - propose_next_steps
    - rank_next_steps

next_steps:
  max_selected: 3
  min_parent_metric: 0.7
  prior_run_similarity_threshold: 0.9
  prior_run_search_results: 5

memory:
  objects:
    - object_type: dataset
      kind: trading_dataset
      reusable: true
      fingerprint_metadata_key: dataset_config_fingerprint
      status_metadata_key: dataset_status
      ready_statuses: [ready]
    - object_type: algorithm
      kind: trading_algorithm
      reusable: true
      fingerprint_metadata_key: algorithm_fingerprint
    - object_type: portfolio
      kind: trading_portfolio
      reusable: true
      fingerprint_metadata_key: portfolio_config_fingerprint
    - object_type: backtest
      kind: trading_backtest
      reusable: true
      fingerprint_metadata_key: backtest_config_fingerprint
      status_metadata_key: backtest_status
      ready_statuses: [ready]

llm:
  default_model: claude-opus-4-6
  step_overrides:
    research: claude-sonnet-4-6
    refine: claude-sonnet-4-6
    evaluate: claude-sonnet-4-6

platform:
  package: trading
  source_path: ../trading_guy

research:
  max_summary_artifacts: 20
  tools:
    - name: arxiv
      tool: core.tools.research_tools.collect_arxiv
      categories: [q-fin.TR, q-fin.PM, q-fin.ST, cs.LG]
      max_results: 8
      relevance_score_threshold: 6
      max_papers_to_digest: 2
    - name: ssrn_finance
      tool: core.tools.research_tools.collect_ssrn_finance
      max_results: 6
      relevance_score_threshold: 7
    - name: nber_asset_pricing
      tool: core.tools.research_tools.collect_nber_asset_pricing
      max_results: 5
      relevance_score_threshold: 6
    - name: repec_finance
      tool: core.tools.research_tools.collect_repec_finance
      max_results: 5
      relevance_score_threshold: 6
    - name: quantpedia_strategies
      tool: core.tools.research_tools.collect_quantpedia_strategies
      max_results: 6
      relevance_score_threshold: 8
    - name: quantconnect_strategies
      tool: core.tools.research_tools.collect_quantconnect_strategies
      max_results: 5
      relevance_score_threshold: 7
    - name: reddit_trading
      tool: core.tools.research_tools.collect_reddit_trading
      max_results: 5
      default_terms: algorithmic trading strategies
      relevance_score_threshold: 5
    - name: aqr_research
      tool: core.tools.research_tools.collect_aqr_research
      max_results: 5
      relevance_score_threshold: 6
    - name: fred_series_context
      tool: core.tools.research_tools.collect_fred_series_context
      relevance_score_threshold: 5
    - name: cftc_cot
      tool: core.tools.research_tools.collect_cftc_cot
      relevance_score_threshold: 5
    - name: sec_filings_signals
      tool: core.tools.research_tools.collect_sec_filings_signals
      relevance_score_threshold: 5
    - name: prior_experiments
      tool: core.tools.research_tools.collect_prior_experiments
      n_results: 8
      relevance_score_threshold: 7
    - name: adapter_context
      tool: core.tools.research_tools.collect_adapter_context
      relevance_score_threshold: 5
    - name: profile_context
      tool: core.tools.research_tools.collect_profile_context
      relevance_score_threshold: 5
    - name: strategy_library
      tool: core.tools.research_tools.collect_strategy_library
      patterns: ["*strategy*.py", "*signal*.py", "*backtest*.py", "*portfolio*.py", "*risk*.py"]
      max_files: 80
      relevance_score_threshold: 5
  domain_context: >
    Focus on systematic trading, market microstructure, robust backtesting,
    regime detection, risk management, transaction costs, and leakage-resistant
    machine learning for financial time series.

base_classes:
  - name: Algorithm
    module: trading.core.algorithm
    description: >
      Base class for generated trading algorithms. Implement on_data_logic()
      and emit MarketSignal objects from the current tick plus rolling history.
    key_interface: |
      class Algorithm:
          def __init__(self, cfg: dict | None = None, history_length: int = 0):
              ...

          @final
          def on_data(self, data: list[PriceData]) -> list[MarketSignal]:
              # Updates rolling history then delegates to on_data_logic().
              # Signals are gated until required_warmup_bars is reached.
              ...

          @abstractmethod
          def on_data_logic(self, data: list[PriceData]) -> list[MarketSignal]:
              # Use self.price_history[symbol] and self.price_data_history[symbol].
              # Must only depend on current and historical bars.
              ...

data_sources:
  - name: default_ohlcv
    description: "Single-symbol OHLCV CSV used by TestDataProvider"
    path: data/SPY_5min.csv
    fields:
      guaranteed: [open, high, low, close, volume]
      optional: [trade_count, vwap, exchange]
  - name: spy_upro_spxu_5min
    description: "Multi-symbol 5-minute OHLCV CSV for rotation/switching algorithms"
    path: data/SPY_UPRO_SPXU_5min.csv
    fields:
      guaranteed: [timestamp, symbol, open, high, low, close, volume]
      optional: [trade_count, vwap, exchange]
  - name: spy_1min
    description: "Single-symbol 1-minute OHLCV CSV for aggregation experiments"
    path: data/SPY_1min.csv
    fields:
      guaranteed: [open, high, low, close, volume]
      optional: [trade_count, vwap, exchange]

risk_constraints:
  no_lookahead: true
  max_gross_exposure: 1.0
  max_single_position: 0.10
  market_orders_only: true
  require_history_warmup: true
  require_walk_forward_split: true

execution:
  defaults:
    mode: backtest
    symbol: SPY
    cash: 100000
    history_length: 200
    stop_pct: 5.0
    profit_pct: 10.0
    tx_cost: 0.0
    data_provider: trading.data_providers.alpaca_data_provider.AlpacaDataProvider
    portfolio: trading.core.pf.single_symbol_portfolio.SingleSymbolPortfolio
    order_manager: trading.core.om.backtesting_om.BacktestingOrderManager
    alpaca_account: longer_range
    timeframe: Minute
    adjustment: split
    limit: 5000
    market_hours_only: true
    aggregation_enabled: true
    aggregation_period_minutes: 5
    log_to_mlflow: false
    benchmarks: {}
    walk_forward:
      optimization_window_days: 90
      trading_window_days: 30
      improvement_threshold_pct: 5.0
      num_trials: 20
      max_concurrent_trials: 4
  mass_test:
    max_variants_per_proposal: 4

implementation_examples:
  - path: ../trading_guy/trading/algorithms/test_algorithm.py
    purpose: Minimal Algorithm subclass shape and MarketSignal return contract.
  - path: ../trading_guy/trading/algorithms/macd_rsi_algorithm.py
    purpose: Real history-driven algorithm using self.price_history and warmup-aware logic.

validate:
  auto_run: true
  max_fix_retries: 3
  test_runner: "uv run pytest"
  test_output_dir: dev/experiments/trading/tests
  contract_test: trading_algorithm
  llm_generate_tests: false

experiment_adapter: core.plugins.trading.adapter

evaluation:
  primary_metric: sharpe_ratio
  metrics:
    - sharpe_ratio
    - sortino_ratio
    - max_drawdown_pct
    - annualized_return
    - win_rate
    - profit_factor
    - total_trades
  thresholds:
    sharpe_ratio: 1.2
    max_drawdown_pct: -20.0

storage:
  mlflow_experiment: trading_agent_experiments
  mongodb_results_db: trading_researcher
  mongodb_results_collection: trading_experiments
  chroma_collection: trading_agent_experiments
  memory_mongodb_db: trading_researcher
  memory_mongodb_collection: trading_memory_records
  artifacts_mongodb_db: trading_researcher
  artifacts_collection: trading_artifacts
  memory_neo4j_database: neo4j

prompts:
  research:
    artifact_score_system: |
      You are an expert in quantitative finance, systematic trading, and robust
      backtesting. Score the following research artifact 0-10 for relevance,
      usefulness, and reliability for the research direction. Prefer artifacts
      with implementable methods, realistic market assumptions, available data,
      leakage-safe validation, transaction costs, and clear risk controls.
      Penalize vague ideas, unavailable data, lookahead risk, and unrealistic fills.
      Respond with valid JSON only:
      {"score": <int 0-10>, "reason": "<one sentence>", "usefulness": "<how to use it>", "risks": "<limitations>"}

    artifact_summary_system: |
      Synthesize the top scored research artifacts into a concise research
      summary focused on actionable systematic trading experiments. Use academic
      papers, prior experiment results, platform inventory, data availability,
      strategy-library context, and risk constraints when available. Highlight
      strategy concepts, data requirements, validation methods, risk controls,
      costs/slippage, and known failure modes such as lookahead bias and overfitting.

    score_system: |
      You are an expert in quantitative finance, systematic trading, and robust
      backtesting. Score the following paper 0-10 for relevance to the research
      direction. Prefer papers with implementable methods and realistic market
      assumptions. Respond with valid JSON only:
      {"score": <int 0-10>, "reason": "<one sentence>"}

    summary_system: |
      Synthesize the provided papers into a concise research summary focused on
      actionable systematic trading experiments. Highlight strategy concepts,
      data requirements, validation methods, risk controls, costs/slippage, and
      known failure modes such as lookahead bias and overfitting.

    digest_system: |
      Extract a structured digest from the paper. Focus on methodology, data,
      target markets, trading rules or model design, backtest protocol, costs,
      risk management, reported metrics, limitations, and implementation ideas.

  ideate:
    system: |
      Propose 3-5 algorithmic trading research ideas grounded in the research
      summary and paper digests.

      Each idea must:
      - Be implementable as a trading.core.algorithm.Algorithm subclass
      - Emit MarketSignal objects from on_data_logic using only current and past bars
      - Include explicit warmup, risk, and execution assumptions
      - Be testable with the Alpaca-backed backtest engine using historical bars only

      Return a JSON array:
      [
        {
          "name": "snake_case_strategy_name",
          "description": "What the strategy or signal measures",
          "hypothesis": "Why it should produce risk-adjusted returns",
          "rationale": "What research inspired this"
        }
      ]

  refine:
    system: |
      Review these trading ideas for feasibility and leakage risk.

      Reject or revise ideas that require future data, unavailable fields,
      unavailable platform APIs, vague order logic, or hand-wavy position sizing.
      Improve accepted ideas with concrete signal logic, rolling-history usage,
      warmup requirements, execution guidance, and realistic hyperparameter
      optimization opportunities.

      Return a JSON array of refined ideas using the same schema.

  propose_experiments:
    system: |
      For each refined idea, specify a complete trading experiment.

      Include:
      - name: same as the idea name
      - description
      - mode: "backtest" or "walk-forward"
      - optimization_target: one of "algorithm", "portfolio", or "joint"
        Use "algorithm" when isolating strategy logic changes with portfolio behavior fixed.
        Use "portfolio" when isolating sizing/risk/portfolio changes with algorithm logic fixed.
        Use "joint" only when intentionally co-optimizing both axes.
      - data_source: exact data source name from the profile
      - data_path: path relative to the trading project root when useful
      - symbol: primary traded symbol
      - timeframe
      - start_date and end_date if known
      - history_length
      - stop_pct
      - profit_pct
      - tx_cost
      - hyperparameters
      - hpo: object for mode="backtest" with:
          - objective_metric
          - num_samples
          - max_concurrent_trials
          - algorithm_param_keys
          - portfolio_param_keys
          - search_space
        The pipeline should decide what parameters to tune based on optimization_target.
        For optimization_target="algorithm", only tune algorithm_param_keys.
        For optimization_target="portfolio", only tune portfolio_param_keys.
        For optimization_target="joint", tune both and always include stop_pct and profit_pct in portfolio_param_keys and search_space.
        Start with a wide search space, not a narrow local search.
        Prefer continuous ranges so the optimizer can search freely.
        Use `uniform`, `loguniform`, or `randint` ranges instead of discrete `choice` lists whenever possible.
        Do not emit `choice` for tunable trading hyperparameters unless a parameter is truly categorical and cannot be represented as a numeric range.
        search_space entries must use the platform schema:
          {type: "randint"|"uniform"|"loguniform", ...}
      - walk_forward: object with optimization/trading windows, trial counts,
        algorithm_param_keys, portfolio_param_keys, and search_space when mode="walk-forward"
        These keys must also respect optimization_target.
      - benchmark
      - aggregation_enabled and aggregation_period_minutes when helpful
      - experiment_variants: optional list of up to 3 named override objects for mass testing
      - success_criterion using sharpe_ratio and max_drawdown_pct

      Return a JSON array of proposals.

  plan_implementation:
    system: |
      For each trading experiment proposal, write a detailed implementation
      plan. Do NOT write Python code.

      Include:
      - proposal_name
      - class_name
      - base_class: "Algorithm"
      - init_fields including config keys and history_length expectations
      - tunable_fields that are sensible to expose to HPO
      - main_method: "on_data_logic"
      - required_warmup_bars if it should exceed history_length
      - method_steps with explicit no-lookahead rolling/window logic
      - output_keys including signal symbol/type/strength/metadata
      - imports_needed

      Return a JSON array of plans.

  implement:
    system: |
      Implement the Python class described in the implementation plan.

      Requirements:
      - Subclass Algorithm from trading.core.algorithm
      - Implement on_data_logic(self, data: list[PriceData]) -> list[MarketSignal]
      - Use trading.core.classes.PriceData, MarketSignal, and SignalType
      - Use self.price_history and self.price_data_history for rolling context
      - Never use future rows to compute current signals
      - Return deterministic signals only; no random behavior
      - Guard against insufficient history and missing symbols cleanly
      - Keep dependencies minimal: standard library, numpy/pandas, and trading package utilities only when necessary
      - Include a small if __name__ == '__main__': smoke block that instantiates the class and runs synthetic ticks without external files

      Return ONLY Python source code. No markdown fences.

  validate:
    system: |
      Generate pytest unit tests for this Algorithm subclass.

      Tests must:
      - Import the generated class
      - Build a small synthetic sequence of PriceData ticks
      - Call on_data repeatedly
      - Assert returned values are lists of MarketSignal objects
      - Assert signal symbols and strengths are valid
      - Include a no-lookahead check by changing the final tick and
        verifying earlier outputs do not change

      Return ONLY Python test code. No markdown fences.

    fix_system: |
      The following tests failed for the Algorithm implementation.
      Fix the implementation, not the tests. Prioritize no-lookahead behavior,
      deterministic outputs, correct MarketSignal usage, and robust warmup handling.
      Return ONLY Python source.

  evaluate:
    system: |
      Analyze these trading experiment results. For each proposal, assess:
      - Risk-adjusted return
      - Drawdown and tail risk
      - Robustness across any experiment_variants or walk-forward periods
      - Benchmark comparison
      - Whether the hypothesis was supported
      - Whether results suggest overfitting or leakage risk

      Return a JSON object:
      {
        "per_proposal": [
          {
            "proposal_name": "...",
            "assessment": "strong|moderate|weak|none",
            "interpretation": "...",
            "key_drivers": [...],
            "hypothesis_supported": true
          }
        ],
        "conclusion": "...",
        "promising_directions": ["...", "..."]
      }

  propose_next_steps:
    system: |
      Based on the backtest results and original research direction, propose 3
      high-value follow-up trading research directions. Prioritize robust,
      leakage-safe improvements, cost sensitivity checks, and walk-forward
      validation.

      Return a JSON array with title, rationale, suggested_direction, priority.

  rank_next_steps:
    system: |
      You are ranking candidate follow-up trading research directions for the
      next loop.

      Goal: select the strongest directions to run next, not to preserve every
      plausible idea.

      Prioritize:
      1. Robustness, leakage safety, and generalization checks
      2. Directions that stress the most promising result under costs, slippage,
         walk-forward splits, or adjacent market regimes
      3. Directions that are concrete, distinct, and executable in one next run

      Avoid:
      - near-duplicates
      - vague “improve the strategy” suggestions
      - directions that simply restate the current research question

      You will receive candidate next steps, each with a candidate_id.
      Return a JSON array containing only the selected candidates, in ranked
      order from best to worst.

      Each array item must be:
      - candidate_id: the exact candidate_id from the input
