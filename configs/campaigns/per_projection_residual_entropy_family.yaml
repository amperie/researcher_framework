profile: trading_researcher

campaign_title: per_projection_residual_entropy family sweep
campaign_id: campaign:per_projection_residual_entropy_family

# The stored source run does not currently expose a root_run_family_id, so this
# config pins the family to the anchor experiment id itself. That keeps every
# descendant run grouped under one stable lineage key.
source_experiment_record_id: f83b1e69-02c9-4f9a-9fd3-efeb57aa90cd
root_run_family_id: f83b1e69-02c9-4f9a-9fd3-efeb57aa90cd
root_research_direction: >
  Extract per-head entropy and claim_fraction features for every (layer, head)
  pair at the yes/no output token position. Use a feature selection wrapper:
  within each CV fold, rank all (layer, head) pairs by univariate AUC on the
  training split, select the top 5 heads, and fit a logistic regression on only
  those 5 features. Report which heads are consistently selected across folds
  (stable head identity) versus variable (unstable). Combine the top-3 most
  consistently selected head features with norm_growth_rate_early in a final
  model. This tests whether individual attention heads generalize better than
  layer-aggregate entropy while keeping dimensionality low enough to avoid
  overfitting on 500 samples.

# Keep all variants inside the same proposal family and skip re-ideation.
start_node: plan_implementation
research_direction: >
  Run targeted variants of per_projection_residual_entropy that preserve the
  same core hypothesis: per-head projection-level claim-ratio and entropy
  signals can generalize for hallucination detection, especially when paired
  with stable head selection and a small supporting norm-growth feature set.

variant_defaults:
  planning_notes: |
    Stay inside the same proposal family as per_projection_residual_entropy.
    Do not invent a new mechanism family.
    Keep the experiment comparable to the anchor run.
    Favor small, interpretable differences in head selection, projection subset,
    feature budget, and regularization.

variants:
  - key: q_top8
    title: Q projection, top 8 features
    name_suffix: q_top8
    planning_notes: Restrict to Q projection features only.
    proposal_patch:
      projection_subset: q
      head_selector: univariate_auc_top_k
      combine_norm_growth_early: true
      hyperparameters:
        max_features: 8

  - key: k_top8
